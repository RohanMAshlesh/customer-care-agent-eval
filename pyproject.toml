[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccevals"
version = "0.1.0"
description = "Evidence-backed evaluation and release decisions for customer-care AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0.29",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
judge = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ccevals = "ccevals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccevals = ["packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
