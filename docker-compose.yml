# Local deployment: API, worker and PostgreSQL. Not a production topology.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ccevals
      POSTGRES_USER: ccevals
      POSTGRES_PASSWORD: ccevals
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccevals"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["ccevals", "db", "upgrade"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      CCEVALS_INLINE_EVALUATION: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["ccevals", "worker", "--interval", "5"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
